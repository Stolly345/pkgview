[package]
name = "pkgview"
version = "2.8.0"
edition = "2021"
rust-version = "1.82"
license = "(MIT OR Apache-2.0) AND ISC"
description = "Browse and extract PS3/PSP .pkg installation packages"
homepage = "https://github.com/Stolly345/pkgview"
repository = "https://github.com/Stolly345/pkgview"
authors = ["Ifcaro <ifcaro@ifcaro.net>", "Alex Stoll <114888417+Stolly345@users.noreply.github.com>"]
readme = "README.md"

[dependencies]
aes = "0.8"
sha1 = "0.10"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"
libc = "0.2"
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Alex Stoll <114888417+Stolly345@users.noreply.github.com>"
copyright = "2010-2012 Ifcaro; 2026 Alex Stoll (Rust port)"
section = "utils"
priority = "optional"
depends = "$auto, libgtk-4-1 (>= 4.14)"
recommends = "python3-nautilus"
extended-description = """\
PkgView lists the contents of PS3/PSP .pkg installation packages (debug and \
retail, PS3 and PSP keys) and decrypts/extracts selected files or folders. \
Rust/GTK4 port of the 2010-2012 Windows tool by Ifcaro."""
assets = [
    ["target/release/pkgview", "usr/bin/", "755"],
    ["data/io.github.stolly345.pkgview.desktop", "usr/share/applications/", "644"],
    ["data/io.github.stolly345.pkgview.extract.desktop", "usr/share/applications/", "644"],
    ["data/pkgview-mime.xml", "usr/share/mime/packages/pkgview.xml", "644"],
    ["data/pkgview.svg", "usr/share/icons/hicolor/scalable/apps/pkgview.svg", "644"],
    ["data/pkgview.png", "usr/share/icons/hicolor/256x256/apps/pkgview.png", "644"],
    ["data/io.github.stolly345.pkgview.metainfo.xml", "usr/share/metainfo/", "644"],
    ["README.md", "usr/share/doc/pkgview/README.md", "644"],
    ["LICENSE", "usr/share/doc/pkgview/LICENSE", "644"],
    ["LICENSE-MIT", "usr/share/doc/pkgview/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/pkgview/LICENSE-APACHE", "644"],
    ["data/pkgview.thumbnailer", "usr/share/thumbnailers/", "644"],
    ["data/nautilus/pkgview-nautilus.py", "usr/share/nautilus-python/extensions/", "644"],
    # generated by `make deb` from the binary (`pkgview man`, `pkgview completions <shell>`)
    ["target/assets/pkgview.1.gz", "usr/share/man/man1/", "644"],
    ["target/assets/pkgview.bash", "usr/share/bash-completion/completions/pkgview", "644"],
    ["target/assets/_pkgview", "usr/share/zsh/vendor-completions/", "644"],
    ["target/assets/pkgview.fish", "usr/share/fish/vendor_completions.d/", "644"],
]

# `make rpm` (cargo generate-rpm after `make deb`'s build + generated assets). Same files as the .deb, at
# Fedora/openSUSE paths. Requirements = the binary's own NEEDED sonames (`readelf -d`), which are the same on
# every distro; auto-req would record the whole library closure of the Ubuntu build host (libjpeg.so.8…).
[package.metadata.generate-rpm]
summary = "Browse and extract PS3/PSP .pkg installation packages"
release = "1"
assets = [
    { source = "target/release/pkgview", dest = "/usr/bin/pkgview", mode = "755" },
    { source = "data/io.github.stolly345.pkgview.desktop", dest = "/usr/share/applications/io.github.stolly345.pkgview.desktop", mode = "644" },
    { source = "data/io.github.stolly345.pkgview.extract.desktop", dest = "/usr/share/applications/io.github.stolly345.pkgview.extract.desktop", mode = "644" },
    { source = "data/pkgview-mime.xml", dest = "/usr/share/mime/packages/pkgview.xml", mode = "644" },
    { source = "data/pkgview.svg", dest = "/usr/share/icons/hicolor/scalable/apps/pkgview.svg", mode = "644" },
    { source = "data/pkgview.png", dest = "/usr/share/icons/hicolor/256x256/apps/pkgview.png", mode = "644" },
    { source = "data/io.github.stolly345.pkgview.metainfo.xml", dest = "/usr/share/metainfo/io.github.stolly345.pkgview.metainfo.xml", mode = "644" },
    { source = "data/pkgview.thumbnailer", dest = "/usr/share/thumbnailers/pkgview.thumbnailer", mode = "644" },
    { source = "data/nautilus/pkgview-nautilus.py", dest = "/usr/share/nautilus-python/extensions/pkgview-nautilus.py", mode = "644" },
    { source = "target/assets/pkgview.1.gz", dest = "/usr/share/man/man1/pkgview.1.gz", mode = "644", doc = true },
    { source = "target/assets/pkgview.bash", dest = "/usr/share/bash-completion/completions/pkgview", mode = "644" },
    { source = "target/assets/_pkgview", dest = "/usr/share/zsh/site-functions/_pkgview", mode = "644" },
    { source = "target/assets/pkgview.fish", dest = "/usr/share/fish/vendor_completions.d/pkgview.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/pkgview/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/pkgview/LICENSE", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/pkgview/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/pkgview/LICENSE-APACHE", mode = "644" },
]
auto-req = "no"

[package.metadata.generate-rpm.requires]
"libgtk-4.so.1()(64bit)" = "*"
"libpango-1.0.so.0()(64bit)" = "*"
"libgdk_pixbuf-2.0.so.0()(64bit)" = "*"
"libgio-2.0.so.0()(64bit)" = "*"
"libgobject-2.0.so.0()(64bit)" = "*"
"libglib-2.0.so.0()(64bit)" = "*"
"libgcc_s.so.1()(64bit)" = "*"
"libc.so.6()(64bit)" = "*"
"libc.so.6(GLIBC_2.39)(64bit)" = "*"

# weak: installed by default when the distro has it (Fedora: nautilus-python, openSUSE: python3-nautilus)
[package.metadata.generate-rpm.recommends]
nautilus-python = "*"
python3-nautilus = "*"
xdg-utils = "*"
