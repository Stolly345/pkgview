[package]
name = "pkgview"
version = "2.3.1"
edition = "2021"
rust-version = "1.82"
license = "ISC"
description = "Browse and extract PS3/PSP .pkg installation packages"
homepage = "https://github.com/Stolly345/pkgview"
repository = "https://github.com/Stolly345/pkgview"
authors = ["Ifcaro <ifcaro@ifcaro.net>", "Alex Stoll <114888417+Stolly345@users.noreply.github.com>"]
readme = "README.md"

[dependencies]
aes = "0.8"
sha1 = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"
libc = "0.2"
gtk = { package = "gtk4", version = "0.9", features = ["v4_8"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Alex Stoll <114888417+Stolly345@users.noreply.github.com>"
copyright = "2010-2012 Ifcaro; 2026 Alex Stoll (Rust port)"
section = "utils"
priority = "optional"
depends = "$auto, libgtk-4-1 (>= 4.8)"
recommends = "python3-nautilus"
extended-description = """\
PkgView lists the contents of PS3/PSP .pkg installation packages (debug and \
retail, PS3 and PSP keys) and decrypts/extracts selected files or folders. \
Rust/GTK4 port of the 2010-2012 Windows tool by Ifcaro."""
assets = [
    ["target/release/pkgview", "usr/bin/", "755"],
    ["data/io.github.stolly345.pkgview.desktop", "usr/share/applications/", "644"],
    ["data/io.github.stolly345.pkgview.extract.desktop", "usr/share/applications/", "644"],
    ["data/pkgview-mime.xml", "usr/share/mime/packages/pkgview.xml", "644"],
    ["data/pkgview.svg", "usr/share/icons/hicolor/scalable/apps/pkgview.svg", "644"],
    ["data/pkgview.png", "usr/share/icons/hicolor/256x256/apps/pkgview.png", "644"],
    ["data/io.github.stolly345.pkgview.metainfo.xml", "usr/share/metainfo/", "644"],
    ["README.md", "usr/share/doc/pkgview/README.md", "644"],
    ["data/pkgview.thumbnailer", "usr/share/thumbnailers/", "644"],
    ["data/nautilus/pkgview-nautilus.py", "usr/share/nautilus-python/extensions/", "644"],
    # generated by `make deb` from the binary (`pkgview man`, `pkgview completions <shell>`)
    ["target/assets/pkgview.1.gz", "usr/share/man/man1/", "644"],
    ["target/assets/pkgview.bash", "usr/share/bash-completion/completions/pkgview", "644"],
    ["target/assets/_pkgview", "usr/share/zsh/vendor-completions/", "644"],
    ["target/assets/pkgview.fish", "usr/share/fish/vendor_completions.d/", "644"],
]
